[project]
name = "indy"
version = "1.1.0"
description = "Semantic search index for local codebases, docs, and notes"
authors = [{ name = "Chris Birch", email = "datapointchris@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "sqlite-vec>=0.1",
    "httpx>=0.27.0",
    "pyselfupdate[typer]>=0.2.2",
    "tree-sitter>=0.21",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-rust>=0.24.2",
]

[project.urls]
Repository = "https://github.com/datapointchris/indy"

[project.scripts]
indy = "indy.main:main"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]


# ---------- Tool Configurations ---------- #


[tool.codespell]
skip = "*.lock"
ignore-words-list = "astroid,aNULL,ANULL,anull"
check-filenames = true


[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

# `standard` replaces the per-rule opt-outs repos used to accumulate; basedpyright
# defaults to `recommended`, which turns every one of them back on. Named
# `pyright` so both basedpyright and Pylance read it.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
verbosity_assertions = 2


[tool.ruff]
line-length = 140
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    ".vscode",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true  # or pylance stops analyzing in vscode

[tool.forge]
# Keys the standard owns, written by `forge repos apply pyproject`.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["pytest", "ini_options", "verbosity_assertions"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]

[build-system]
requires = ["uv_build>=0.9.13,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "indy"
module-root = "src"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "build(release): {version}"
# The package name is hardcoded on purpose. python-semantic-release sets no
# $PACKAGE_NAME, so `uv lock --upgrade-package "$PACKAGE_NAME"` silently no-ops
# and ships a stale lock file in the release commit.
build_command = """
    pip install uv
    uv lock --upgrade-package indy
    git add uv.lock
"""
